    <script>
      function openHelp() {
        if (window.opener) {
          window.opener.postMessage({ type: 'OPEN_HELP' }, '*');
        } else {
          alert("Vui lòng mở bảng điểm từ phần mềm chính để xem hướng dẫn.");
