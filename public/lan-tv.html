<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K-SPORT LAN TV</title>
  <style>
    :root{color-scheme:dark;--bg:#050a12;--panel:#0d192b;--line:#334155;--muted:#94a3b8;--green:#22c55e;--yellow:#facc15;--red:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17314f 0,#0d192b 48%,var(--bg) 100%);color:#f8fafc;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}.screen{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(18px,2.8vw,46px);gap:clamp(16px,2.2vh,30px)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:clamp(14px,1.8vh,22px)}.brand-lockup{display:flex;align-items:center;gap:clamp(14px,1.4vw,24px)}.brand-logo{width:clamp(52px,4.5vw,82px);height:clamp(52px,4.5vw,82px);object-fit:cover;border-radius:18%;box-shadow:0 8px 24px rgba(0,0,0,.32);flex:0 0 auto}.brand{font-weight:900;font-size:clamp(24px,3vw,50px);letter-spacing:.08em}.summary{color:var(--yellow);border:2px solid var(--yellow);border-radius:14px;padding:9px 20px;font-size:clamp(16px,1.7vw,28px);font-weight:900}.mats{min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(14px,1.7vw,26px)}.mat-card{min-height:0;border:1px solid #263b55;border-radius:20px;background:linear-gradient(145deg,rgba(19,40,65,.96),rgba(7,16,29,.98));box-shadow:0 15px 40px rgba(0,0,0,.28);padding:clamp(18px,2vw,30px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(14px,2vh,24px);overflow:hidden}.mat-card.stale{border-color:rgba(239,68,68,.65)}.mat-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.mat-name{color:var(--yellow);font-weight:900;font-size:clamp(24px,2.5vw,42px)}.live{display:flex;align-items:center;color:#86efac;font-size:clamp(13px,1.1vw,18px);font-weight:800}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--green);margin-right:8px;box-shadow:0 0 15px var(--green)}.stale .live{color:#fca5a5}.stale .dot,.offline .dot{background:var(--red);box-shadow:0 0 15px var(--red)}.current-wrap{display:flex;flex-direction:column;justify-content:center;min-height:0}.label{font-size:clamp(13px,1.25vw,21px);font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.current{font-size:clamp(27px,3.6vw,62px);font-weight:900;line-height:1.08;text-transform:uppercase;text-shadow:0 7px 24px #000;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.participants{font-size:clamp(18px,2vw,32px);font-weight:700;color:#e2e8f0;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#cbd5e1;font-size:clamp(13px,1.15vw,19px);margin-top:10px;min-height:1.3em}.nextbox{border-left:6px solid var(--green);background:linear-gradient(90deg,rgba(34,197,94,.16),rgba(34,197,94,.025));padding:14px 18px;border-radius:0 12px 12px 0}.next{font-size:clamp(19px,2vw,34px);font-weight:800;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-participants{font-size:clamp(15px,1.45vw,24px);font-weight:650;color:#d1fae5;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:var(--muted)}.waiting{grid-column:1/-1;display:grid;place-content:center;text-align:center;color:var(--muted)}.waiting strong{font-size:clamp(32px,5vw,76px);color:#cbd5e1}.waiting span{font-size:clamp(16px,1.6vw,26px);margin-top:14px}footer{display:flex;justify-content:space-between;align-items:center;color:#94a3b8;font-size:clamp(13px,1.15vw,20px)}.clock{font-variant-numeric:tabular-nums;color:#e2e8f0}@media(max-width:900px){.mats{grid-template-columns:1fr}.mat-card{padding:18px}.current{font-size:clamp(25px,6vw,44px)}}
  </style>
</head>
<body>
  <main class="screen">
    <header><div class="brand-lockup"><img class="brand-logo" src="/assets/ksport-logo.png" alt="Logo K-SPORT"><div class="brand">K-SPORT LIVE</div></div><div class="summary" id="summary">ĐANG KẾT NỐI</div></header>
    <section class="mats" id="mats"><div class="waiting"><strong>Đang chờ dữ liệu các thảm...</strong><span>Các máy Thư ký sẽ tự động xuất hiện tại đây</span></div></section>
    <footer><div id="connection"><span class="dot"></span><span id="status">Đang kết nối máy Admin</span></div><div class="clock" id="clock"></div></footer>
  </main>
  <script>
    const STALE_AFTER_MS = 12000;
    const matsEl = document.getElementById('mats');
    const summaryEl = document.getElementById('summary');
    const connectionEl = document.getElementById('connection');
    const statusEl = document.getElementById('status');
    let rows = [];
    let streamConnected = false;

    function text(value) {
      return String(value == null ? '' : value).normalize('NFC')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function sortMats(left, right) {
      return String(left.mat_id || '').localeCompare(String(right.mat_id || ''), 'vi', { numeric: true });
    }

    function render() {
      const now = Date.now();
      const sorted = [...rows].sort(sortMats);
      const onlineCount = sorted.filter(row => now - new Date(row.updated_at).getTime() <= STALE_AFTER_MS).length;
      summaryEl.textContent = sorted.length ? `${onlineCount}/${sorted.length} THẢM ĐANG LIVE` : 'ĐANG CHỜ CÁC THẢM';
      if (!sorted.length) {
        matsEl.innerHTML = '<div class="waiting"><strong>Đang chờ dữ liệu các thảm...</strong><span>Các máy Thư ký sẽ tự động xuất hiện tại đây</span></div>';
        return;
      }
      matsEl.innerHTML = sorted.map(row => {
        const data = row.data || {};
        const current = data.current || {};
        const next = data.next || {};
        const updatedAt = new Date(row.updated_at).getTime();
        const stale = !Number.isFinite(updatedAt) || now - updatedAt > STALE_AFTER_MS;
        const meta = [];
        if (data.roundName) meta.push(data.roundName);
        if (data.matchCode) meta.push(`Trận ${data.matchCode}`);
        if (current.scheduledTime) meta.push(`Lịch ${current.scheduledTime}`);
        const currentParticipants = current.participantText || '';
        const nextParticipants = next.participantText || (next.name ? 'Chưa xác định VĐV' : '');
        return `<article class="mat-card${stale ? ' stale' : ''}">
          <div class="mat-head"><div class="mat-name">THẢM ${text(row.mat_id)}</div><div class="live"><span class="dot"></span>${stale ? 'MẤT ĐỒNG BỘ' : 'LIVE'}</div></div>
          <div class="current-wrap"><div class="label">${current.status === 'completed' ? 'Trạng thái' : 'Đang thi đấu'}</div><div class="current${current.name ? '' : ' empty'}">${text(current.name || 'Đang chờ Thư ký cập nhật...')}</div>${currentParticipants ? `<div class="participants">${text(currentParticipants)}</div>` : ''}<div class="meta">${text(meta.join(' • '))}</div></div>
          <div class="nextbox"><div class="label">Nội dung tiếp theo</div><div class="next${next.name ? '' : ' empty'}">${text(next.name || 'Đã hoàn tất lịch thi đấu của thảm này')}</div>${nextParticipants ? `<div class="next-participants">${text(nextParticipants)}</div>` : ''}</div>
        </article>`;
      }).join('');
    }

    function setConnection(ok, message) {
      connectionEl.className = ok ? '' : 'offline';
      statusEl.textContent = message;
    }

    function applyRows(nextRows) {
      if (Array.isArray(nextRows)) rows = nextRows;
      render();
    }

    async function refresh() {
      try {
        const response = await fetch('/api/live-status', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        applyRows(result.data || []);
        if (!streamConnected) setConnection(true, 'Đã kết nối máy Admin • chế độ dự phòng');
      } catch {
        if (!streamConnected) setConnection(false, 'Mất kết nối máy Admin — đang thử lại');
      }
    }

    function connectStream() {
      const stream = new EventSource('/api/live-status/events');
      stream.addEventListener('open', () => {
        streamConnected = true;
        setConnection(true, 'Đồng bộ trực tiếp với máy Admin');
      });
      stream.addEventListener('live-status', event => {
        try { applyRows(JSON.parse(event.data)); } catch { /* wait for the next event */ }
      });
      stream.addEventListener('error', () => {
        streamConnected = false;
        setConnection(false, 'Đang kết nối lại máy Admin...');
      });
    }

    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleString('vi-VN');
    }, 1000);
    setInterval(render, 3000);
    setInterval(refresh, 5000);
    refresh();
    connectStream();
  </script>
</body>
</html>
